name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - run: npm run build

      - name: Fix wrangler config (remove no_bundle)
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('dist/server/wrangler.json','utf8'));delete c.no_bundle;fs.writeFileSync('dist/server/wrangler.json',JSON.stringify(c))"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 346165a0599442a570212315a06854a3
          command: deploy --config dist/server/wrangler.json